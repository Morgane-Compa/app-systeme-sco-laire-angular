<div class="modal-backdrop" (click)="close()"></div>
<div class="modal-content">
  <h2>Publier une actualité : </h2>

  <form [formGroup]="newsForm" (ngSubmit)="submitNews()">
    <div class="form-group">
      <label for="news_text">Texte de l'actualité</label>
      <textarea id="news_text" formControlName="news_text" required></textarea>
    </div>
    <div class="form-group">
      <label for="image">Image (URL)</label>
      <input type="text" id="image" formControlName="image">
    </div>
    <button type="submit" [disabled]="newsForm.invalid">Publier</button>
  </form>

  <button (click)="close()">Fermer</button>
</div>
